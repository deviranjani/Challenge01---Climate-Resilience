# Phase 1 — Instruction topology facts
# Generated by orange-lens-ai-bootstrapper, bootstrap run 2026-10-27.

repo_name: Challenge01---Climate-Resilience
repo_purpose: >
  Agents for Impact 2026, Challenge 1 (Community Climate Resilience: Urban Heat) starter kit.
  Ships data-loading notebooks/scripts for NOAA Heat Watch + GHCN-Daily + ACS data in BigQuery,
  and an empty agent/ scaffold for teams to build a Google ADK planning-assistant agent over a
  BigQuery ML heat-offset model. This fork (heat_planner) has the agent lane implemented.

ai_tool_target: none_detected
ai_tool_target_decision:
  step: "Repo Discovery Phase 0, git log --all --grep and repo-signal scan"
  evidence:
    - "git log --all --grep for 'Co-authored-by: Copilot' / 'Co-Authored-By: Claude' / 'Generated with' returned no hits (2 commits total)"
    - "No .github/copilot-instructions.md, no .vscode/settings.json github.copilot.* key"
    - "No CLAUDE.md, no AGENTS.md, no .claude/ directory prior to this bootstrap run"
  conclusion: >
    No tool-usage signal of any kind — none_detected, treated as claude default per
    repo-discovery skill ("none_detected gets the same output as claude"). Self-contained
    CLAUDE.md + .claude/rules/ shape selected (ADR-054).

shape: self-contained

layers:
  - name: adk-agent
    runtime: Python 3.11
    framework: google-adk >=2.12,<3 (Agent, Runner, InMemorySessionService, callbacks)
    source_paths:
      - "agent/heat_planner/agent.py"
      - "agent/heat_planner/sub_agents.py"
      - "agent/heat_planner/callbacks.py"
      - "agent/heat_planner/context.py"
      - "agent/heat_planner/prompts.py"
      - "agent/heat_planner/service.py"
    notes: >
      Root agent (heat_planner) routes to 3 sub-agents (prediction_analyst, history_analyst,
      community_analyst), each with a narrow tool set. Fresh Agent tree + in-memory session
      per request (service.py); server keeps no state, browser resends history.

  - name: bigquery
    runtime: Python 3.11
    framework: google-cloud-bigquery >=3.40
    source_paths:
      - "agent/heat_planner/bq.py"
      - "agent/heat_planner/tools/prediction.py"
      - "agent/heat_planner/tools/community.py"
      - "agent/heat_planner/tools/history.py"
    notes: >
      Single client factory (bq.py:_client, lru_cache), one run_query() entry point with
      maximum_bytes_billed and max_rows caps. Tools never build SQL from model text — fixed
      SQL + bigquery.ScalarQueryParameter. ML.EXPLAIN_PREDICT used for the offset_model.

  - name: api
    runtime: Python 3.11
    framework: FastAPI >=0.115, uvicorn[standard] >=0.34
    source_paths:
      - "agent/heat_planner/api.py"
      - "agent/ui/static/"
    notes: >
      JSON API (/api/chat, /api/map/*, /api/graph) + static single-page UI. Global exception
      handler returns {"error": type}. Pydantic request models enforce length caps.

  - name: data-pipeline
    runtime: bash / Jupyter (Colab Enterprise)
    framework: BigQuery CLI (bq, gcloud storage)
    source_paths:
      - "notebooks/c1_01_load_explore.ipynb"
      - "notebooks/c1_90_publish_snapshot.ipynb"
      - "scripts/load.sh"
    notes: >
      notebooks/c1_01_load_explore.ipynb is the primary, documented load path; scripts/load.sh
      is a headless fallback that replaces (never appends to) 3 tables in BigQuery dataset
      a4i_climate: heat_observations, station_daily_temps, tract_demographics.

test_framework:
  name: pytest
  version: ">=8 (agent/requirements-dev.txt)"
  http_client: "httpx>=0.27 (FastAPI TestClient)"
  test_paths:
    - "agent/tests/test_agent_wiring.py"
    - "agent/tests/test_api.py"
    - "agent/tests/test_mapdata.py"
    - "agent/tests/test_service.py"
    - "agent/tests/test_tools.py"
  conftest: "agent/tests/conftest.py — autouse fixture sets GOOGLE_CLOUD_PROJECT=test-project, clears prediction._coverage lru_cache"
  mocking_strategy: >
    BigQuery is mocked via monkeypatch.setattr(module, "run_query", fake_runner(...)) — no live
    BigQuery or Vertex AI calls in the suite. ADK's model is replaced with a ScriptedLlm
    (test_service.py) that yields scripted function_call / text parts, driving the real
    Runner/Agent/callback loop end to end without a live Gemini call.
  not_covered_by_tests:
    - "agent/heat_planner/config.py (load_settings) — no direct unit test found"
    - "agent/heat_planner/callbacks.py before_model step-budget truncation path — only reached indirectly via test_service.test_step_budget_stops_a_looping_model"

ci_cd_platform: "none found prior to this bootstrap run (no .github/workflows/, no Makefile)"

existing_governance: "none — first bootstrap run, no docs/governance/.bootstrap-checkpoint.md found"

secrets_and_config:
  source: "agent/heat_planner/config.py, agent/README.md deploy section (agent/.env.example exists but was not readable under this session's permission settings — config.py env var names used instead, which is the authoritative list since load_settings() reads exactly these)"
  env_vars:
    - "GOOGLE_CLOUD_PROJECT — GCP project id, no default (empty string)"
    - "BQ_DATASET — default a4i_climate"
    - "BQML_MODEL — default offset_model"
    - "HEAT_AGENT_MODEL — default gemini-2.5-flash"
    - "HEAT_CITY — default Dallas"
    - "BQ_LOCATION — default US"
    - "BQ_MAX_BYTES_BILLED — default 1e9 (1 GB hard ceiling per query)"
    - "BQ_MAX_ROWS — default 500"
    - "HEAT_VERTEX_LOCATION — default us-central1"
    - "HEAT_AGENT_MAX_STEPS — default 12"
    - "GOOGLE_GENAI_USE_VERTEXAI — forced true (Gemini via Vertex AI, service-account auth, no API key)"
    - "GOOGLE_MAPS_API_KEY — read directly from os.environ in mapdata.py:maps_config(), no default"
  deploy_service_account_scopes: "BigQuery Job User, BigQuery Data Viewer (on the dataset), Vertex AI User — per agent/README.md Cloud Run deploy section"

observability:
  logging: "logging.basicConfig(level=INFO) in agent.py; module loggers in api.py, bq.py, mapdata.py, callbacks.py, service.py"
  tool_trace: "callbacks.py records a per-request tool call trace (ctx.steps) with timing (ms) and turns results into UI 'cards' — in-memory only, per-request, not exported"
  gaps: "No structured logging (no correlation/request ID propagated through BigQuery or Gemini calls), no metrics, no tracing/span export, no external log/metrics sink configured. Recorded as an open concern, not fabricated as present."

integrations:
  - name: "Google BigQuery"
    purpose: "primary data store + ML.EXPLAIN_PREDICT model serving"
    dataset: "a4i_climate (configurable via BQ_DATASET)"
    tables: ["heat_observations", "station_daily_temps", "tract_demographics"]
    model: "offset_model (BQML, configurable via BQML_MODEL)"
  - name: "Vertex AI / Gemini"
    purpose: "LLM reasoning for the ADK agent tree"
    access: "google-adk + GOOGLE_GENAI_USE_VERTEXAI=true, authenticated by the Cloud Run service account (no API key)"
  - name: "Google Maps JavaScript API"
    purpose: "heat map + deck.gl overlay in agent/ui/static"
    key_source: "GOOGLE_MAPS_API_KEY env var, read by mapdata.maps_config()"
    note: "agent/README.md instructs restricting the key to the Maps JavaScript API and the app's own URLs"

concerns_seed:
  - "No CI/CD existed before this bootstrap run (addressed by Phase 7/Gold additions in this run)"
  - "requirements.txt uses open version ranges (google-adk>=2.12,<3; google-cloud-bigquery>=3.40; fastapi>=0.115; uvicorn[standard]>=0.34) rather than pinned/locked versions"
  - "No structured observability (see observability.gaps above)"
  - "agent/.env.example could not be read under this session's directory permission settings; env var names were cross-checked against config.py instead, which is authoritative for defaults"
