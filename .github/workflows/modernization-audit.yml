name: Modernization Audit
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run modernization audit script
        run: bash scripts/modernization-audit.sh
      - name: Flag overdue modernization run (>120 days — Gold G4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(ls -d docs/modernization/runs/[0-9]*/ 2>/dev/null | sort | tail -1 | xargs -n1 basename 2>/dev/null)
          if [ -z "$latest" ]; then exit 0; fi
          d=${latest:0:10}
          age=$(( ( $(date +%s) - $(date -d "$d" +%s) ) / 86400 ))
          if [ "$age" -gt 120 ]; then
            open=$(gh issue list --state open --search "Modernization audit overdue in:title" --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "${open:-0}" = "0" ]; then
              gh issue create \
                --title "Modernization audit overdue (${age}d)" \
                --body "Last run ($latest) is ${age}d old, past the 120d Gold G4 window." \
                2>/dev/null || true
            fi
          fi
